name: VOX Avengers Doomsday Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Diagnose VOX connectivity
        continue-on-error: true
        run: |
          U="https://egy.voxcinemas.com/movies/avengers-doomsday-infinity-vision"
          for v in --http1.1 --http2; do
            echo "== curl $v =="
            curl $v -sS -m 25 -o /dev/null -A "Mozilla/5.0" \
              -w "connect=%{time_connect}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s code=%{http_code}\n" \
              "$U" || echo "curl failed with exit code $?"
          done

      - name: Run VOX monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py

      - name: Save monitor state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Update monitor state [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"