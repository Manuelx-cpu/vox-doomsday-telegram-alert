name: VOX Avengers Doomsday Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium and its system dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Diagnose VOX HTTP connectivity
        run: |
          python - <<'PY'
          import requests, time

          urls = [
              "https://egy.voxcinemas.com/",
              "https://egy.voxcinemas.com/movies/avengers-doomsday-infinity-vision",
              "https://egy.voxcinemas.com/showtimes",
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36"
          }

          for url in urls:
              print(f"\n--- Testing {url} ---", flush=True)
              started = time.monotonic()

              try:
                  r = requests.get(
                      url,
                      headers=headers,
                      timeout=(15, 30),
                      allow_redirects=True
                  )
                  print("HTTP status:", r.status_code)
                  print("Elapsed:", round(time.monotonic() - started, 1), "seconds")
                  print("Final URL:", r.url)
                  print("Content-Type:", r.headers.get("content-type"))
                  print("Downloaded bytes:", len(r.content))
                  print("Response sample:", r.text[:250])

              except requests.RequestException as e:
                  print("REQUEST FAILED:", type(e).__name__, str(e))

          PY

      - name: Run VOX monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save monitor state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "Update monitor state"
            git push
          fi