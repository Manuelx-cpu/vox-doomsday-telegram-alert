name: Monitor VOX Doomsday showtimes

on:
  schedule:
    # Every five minutes, offset from the top of the hour to reduce queue delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Log the VOX page text for each date (diagnostics)"
        type: boolean
        default: false

# Only one monitor run at a time; a queued run waits instead of cancelling.
concurrency:
  group: vox-doomsday-monitor
  cancel-in-progress: false

# state.json is committed back to the repository, so contents: write is required.
permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check whether monitoring is still needed
        id: gate
        run: python monitor.py --gate

      - name: Diagnose VOX reachability
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          # Diagnostic only: it reports and never fails the job. No credentials involved.
          url='https://egy.voxcinemas.com/showtimes?c=mall-of-egypt&m=avengers-doomsday-infinity-vision'
          set +e
          result=$(curl --silent --show-error --location --http1.1 --max-time 30 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
            --output /dev/null \
            --write-out 'HTTP %{http_code} | remote_ip=%{remote_ip} | elapsed=%{time_total}s' \
            "$url" 2>&1)
          code=$?
          echo "VOX reachability: ${result}"
          if [ "$code" -ne 0 ]; then
            echo "::warning::curl could not fetch the VOX page (curl exit code ${code}); see the line above."
          fi
          exit 0

      - name: Cache Playwright browsers
        if: steps.gate.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.gate.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check VOX and send Telegram messages
        id: monitor
        if: steps.gate.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: python monitor.py

      # Runs even when the monitor failed, so a message that was already sent is
      # never forgotten. It cannot turn a failed monitor step into a success.
      - name: Save state.json
        if: always() && steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- state.json; then
            echo "state.json unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update VOX monitor state"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state.json pushed."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "::error::Could not push state.json after 5 attempts."
          exit 1
